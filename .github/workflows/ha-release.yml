name: HA Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Integration version to release (must already match manifest.json and const.py)"
        required: true
        type: string
      prerelease:
        description: "Create the GitHub release as a prerelease"
        required: true
        type: boolean
        default: true
      dry-run:
        description: "Build and verify packages without creating a GitHub release"
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  release-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and validate release packages
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/preflight-ha-release.py --version "${VERSION}"

      - name: Verify generated frontend is committed
        run: |
          git diff --exit-code -- custom_components/ha_3d_dashboard/frontend
          test -z "$(git status --porcelain --untracked-files=all -- custom_components/ha_3d_dashboard/frontend)"

      - name: Release preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "Release source: ${RELEASE_SHA}"
          echo "Tag: ${TAG}"
          cat dist/SHA256SUMS

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; refusing to reuse it."
            exit 1
          fi

      - name: Create GitHub release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          PRERELEASE_FLAG=""
          if [ "${PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}" \
            --target "${RELEASE_SHA}" \
            --title "HA 3D Dashboard v${VERSION}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            dist/ha_3d_dashboard.zip \
            "dist/ha_3d_dashboard-v${VERSION}.zip" \
            dist/SHA256SUMS

      - name: Dry-run summary
        if: inputs.dry-run == true
        run: |
          echo "Dry run complete. No tag or release was created."
          ls -lh dist/ha_3d_dashboard.zip "dist/ha_3d_dashboard-v${{ inputs.version }}.zip" dist/SHA256SUMS
