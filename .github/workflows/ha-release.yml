name: HA Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Integration version to release (must already match manifest.json and const.py)"
        required: true
        type: string
      prerelease:
        description: "Create the GitHub release as a prerelease"
        required: true
        type: boolean
        default: true
      dry-run:
        description: "Build and verify packages without creating a GitHub release"
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  release-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version and HACS metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          requested = os.environ["REQUESTED_VERSION"].strip()
          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?", requested) is None:
              raise SystemExit(f"Invalid version: {requested!r}")

          manifest = json.loads(Path("custom_components/ha_3d_dashboard/manifest.json").read_text())
          source_version = manifest.get("version")
          if source_version != requested:
              raise SystemExit(
                  f"Requested version {requested!r} does not match manifest version {source_version!r}. "
                  "Bump and review the source version before releasing."
              )

          const_text = Path("custom_components/ha_3d_dashboard/const.py").read_text()
          match = re.search(r'^VERSION:\s*Final\s*=\s*["\']([^"\']+)["\']\s*$', const_text, re.MULTILINE)
          if match is None or match.group(1) != requested:
              raise SystemExit("const.py VERSION does not match the requested release version")

          hacs = json.loads(Path("hacs.json").read_text())
          if hacs.get("zip_release") is not True:
              raise SystemExit("hacs.json must enable zip_release")
          if hacs.get("filename") != "ha_3d_dashboard.zip":
              raise SystemExit("hacs.json filename must be ha_3d_dashboard.zip")
          PY

      - name: Build HACS release package
        run: |
          python3 scripts/build-ha-package.py --layout hacs --output dist/ha_3d_dashboard.zip

      - name: Verify generated frontend is committed
        run: |
          git diff --exit-code -- custom_components/ha_3d_dashboard/frontend
          test -z "$(git status --porcelain --untracked-files=all -- custom_components/ha_3d_dashboard/frontend)"

      - name: Build manual install package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/build-ha-package.py             --skip-frontend-build             --layout manual             --output "dist/ha_3d_dashboard-v${VERSION}.zip"

      - name: Write checksums
        working-directory: dist
        run: sha256sum ha_3d_dashboard.zip ha_3d_dashboard-v${{ inputs.version }}.zip > SHA256SUMS

      - name: Release preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "Release source: ${RELEASE_SHA}"
          echo "Tag: ${TAG}"
          cat dist/SHA256SUMS

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; refusing to reuse it."
            exit 1
          fi

      - name: Create GitHub release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          PRERELEASE_FLAG=""
          if [ "${PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}"             --target "${RELEASE_SHA}"             --title "HA 3D Dashboard v${VERSION}"             --generate-notes             ${PRERELEASE_FLAG}             dist/ha_3d_dashboard.zip             "dist/ha_3d_dashboard-v${VERSION}.zip"             dist/SHA256SUMS

      - name: Dry-run summary
        if: inputs.dry-run == true
        run: |
          echo "Dry run complete. No tag or release was created."
          ls -lh dist/ha_3d_dashboard.zip "dist/ha_3d_dashboard-v${{ inputs.version }}.zip" dist/SHA256SUMS
