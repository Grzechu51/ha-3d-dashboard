name: HA 3D Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer release version, without the v prefix"
        required: true
        type: string
      dry-run:
        description: "Build and validate the release without publishing it"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "HA releases must be dispatched from main, not $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be SemVer, for example 0.4.0" >&2
            exit 1
          fi

          MANIFEST_VERSION="$(jq -r '.version' custom_components/ha_3d_dashboard/manifest.json)"
          CONST_VERSION="$(sed -n 's/^VERSION: Final = "\([^"]*\)"/\1/p' custom_components/ha_3d_dashboard/const.py)"

          if [ "$MANIFEST_VERSION" != "$RELEASE_VERSION" ]; then
            echo "manifest.json version $MANIFEST_VERSION does not match $RELEASE_VERSION" >&2
            exit 1
          fi
          if [ "$CONST_VERSION" != "$RELEASE_VERSION" ]; then
            echo "const.py version $CONST_VERSION does not match $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Home Assistant integration
        run: |
          python3 -m compileall -q custom_components/ha_3d_dashboard
          python3 -m json.tool custom_components/ha_3d_dashboard/manifest.json >/dev/null
          python3 -m unittest discover -s custom_components/ha_3d_dashboard/tests -p 'test_*.py'

      - name: Build native Home Assistant panel
        run: bun run --cwd apps/editor build:ha-panel

      - name: Verify generated panel is committed
        run: |
          if ! git diff --exit-code -- custom_components/ha_3d_dashboard/frontend; then
            echo "Generated HA panel differs from the committed bundle." >&2
            echo "Run the HA panel build and commit the generated frontend before releasing." >&2
            exit 1
          fi

      - name: Build HACS release archive
        shell: bash
        run: |
          rm -rf dist/ha_3d_dashboard
          mkdir -p dist/ha_3d_dashboard

          rsync -a             --exclude '__pycache__/'             --exclude '*.pyc'             --exclude 'tests/'             custom_components/ha_3d_dashboard/             dist/ha_3d_dashboard/

          (
            cd dist/ha_3d_dashboard
            zip -qr ../ha_3d_dashboard.zip .
          )

          unzip -l dist/ha_3d_dashboard.zip
          test -f dist/ha_3d_dashboard.zip

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ha-3d-dashboard-${{ inputs.version }}
          path: dist/ha_3d_dashboard.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          TAG="v$RELEASE_VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

          gh release create "$TAG"             dist/ha_3d_dashboard.zip             --target "$GITHUB_SHA"             --title "HA 3D Dashboard $TAG"             --generate-notes
