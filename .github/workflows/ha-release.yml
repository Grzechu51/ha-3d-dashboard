name: HA Release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/ha_3d_dashboard/manifest.json"
      - "custom_components/ha_3d_dashboard/const.py"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override; must already match manifest.json and const.py"
        required: false
        type: string
      dry-run:
        description: "Build and verify packages without creating a GitHub release"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_DRY_RUN: ${{ inputs['dry-run'] }}
        run: |
          CURRENT_VERSION="$(python3 -c 'import json; print(json.load(open("custom_components/ha_3d_dashboard/manifest.json", encoding="utf-8"))["version"])')"
          CONST_VERSION="$(sed -n 's/^VERSION: Final = "\\(.*\\)"$/\\1/p' custom_components/ha_3d_dashboard/const.py)"

          if [ -z "${CURRENT_VERSION}" ] || [ "${CURRENT_VERSION}" != "${CONST_VERSION}" ]; then
            echo "Version mismatch before release: manifest=${CURRENT_VERSION:-<missing>} const=${CONST_VERSION:-<missing>}"
            exit 1
          fi

          VERSION="${CURRENT_VERSION}"
          DRY_RUN="false"
          SHOULD_RELEASE="true"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${REQUESTED_VERSION}" ]; then
              VERSION="${REQUESTED_VERSION}"
            fi
            DRY_RUN="${REQUESTED_DRY_RUN:-false}"
          else
            PREVIOUS_VERSION=""
            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
              PREVIOUS_VERSION="$(git show "${BEFORE_SHA}:custom_components/ha_3d_dashboard/manifest.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)"
            fi
            if [ -n "${PREVIOUS_VERSION}" ] && [ "${PREVIOUS_VERSION}" = "${CURRENT_VERSION}" ]; then
              SHOULD_RELEASE="false"
            fi
          fi

          case "${VERSION}" in
            *-*) PRERELEASE="true" ;;
            *) PRERELEASE="false" ;;
          esac

          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "dry_run=${DRY_RUN}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Resolved version: ${VERSION}"
          echo "Prerelease: ${PRERELEASE}"
          echo "Dry run: ${DRY_RUN}"
          echo "Should release: ${SHOULD_RELEASE}"

      - uses: oven-sh/setup-bun@v2
        if: steps.release.outputs.should_release == 'true'
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: bun install --frozen-lockfile

      - name: Build and validate release packages
        if: steps.release.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/preflight-ha-release.py --version "${VERSION}"

      - name: Enforce beta release lock
        if: steps.release.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if test -f BETA_RELEASE_LOCK; then
            case "${VERSION}" in
              *-beta.*) ;;
              *)
                echo "BETA_RELEASE_LOCK requires a -beta.N integration version."
                exit 1
                ;;
            esac
            if [ "${PRERELEASE}" != "true" ]; then
              echo "BETA_RELEASE_LOCK requires a prerelease version."
              exit 1
            fi
          fi

      - name: Verify generated frontend is committed
        if: steps.release.outputs.should_release == 'true'
        run: |
          git diff --exit-code -- custom_components/ha_3d_dashboard/frontend
          test -z "$(git status --porcelain --untracked-files=all -- custom_components/ha_3d_dashboard/frontend)"

      - name: Release preflight
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "Release source: ${RELEASE_SHA}"
          echo "Tag: ${TAG}"
          cat dist/SHA256SUMS

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; refusing to reuse it."
            exit 1
          fi

      - name: Create GitHub release
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          PRERELEASE_FLAG=""
          if [ "${PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${TAG}" \
            --target "${RELEASE_SHA}" \
            --title "HA 3D Dashboard v${VERSION}" \
            --generate-notes \
            ${PRERELEASE_FLAG} \
            dist/ha_3d_dashboard.zip \
            "dist/ha_3d_dashboard-v${VERSION}.zip" \
            dist/SHA256SUMS

      - name: Dry-run summary
        if: steps.release.outputs.should_release == 'true' && steps.release.outputs.dry_run == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Dry run complete. No tag or release was created."
          ls -lh dist/ha_3d_dashboard.zip "dist/ha_3d_dashboard-v${VERSION}.zip" dist/SHA256SUMS

      - name: No release needed
        if: steps.release.outputs.should_release != 'true'
        run: echo "Source version did not change; skipping HA release."
