name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "LICENSE"
      - "LICENSE.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The HA panel bundle is generated in CI and synced back to same-repository PRs.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pinned to match `packageManager` in package.json. Unpinned, this floats
      # to whatever bun is latest, so a bun release can break the gate with no
      # change in the repo — and CI then disagrees with what contributors run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: Validate agent skills and plugin packages
        run: bun run skills:validate

      - name: Validate Home Assistant custom integration
        run: |
          python3 -m compileall -q custom_components/ha_3d_dashboard
          python3 -m json.tool custom_components/ha_3d_dashboard/manifest.json >/dev/null
          python3 -m unittest discover -s custom_components/ha_3d_dashboard/tests -p 'test_*.py'
          bun run --cwd apps/editor build:ha-panel

      - name: Verify HA install packages
        run: |
          python3 -m json.tool hacs.json >/dev/null
          python3 scripts/build-ha-package.py --skip-frontend-build --layout manual --output /tmp/ha_3d_dashboard-manual.zip
          python3 scripts/build-ha-package.py --skip-frontend-build --layout hacs --output /tmp/ha_3d_dashboard-hacs.zip

      - name: Upload generated HA panel bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha3d-panel-bundle
          path: custom_components/ha_3d_dashboard/frontend/
          if-no-files-found: warn
          retention-days: 3

      - name: Checkout PR head for generated frontend
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          path: pr-head

      - name: Commit generated HA frontend
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -rf pr-head/custom_components/ha_3d_dashboard/frontend
          mkdir -p pr-head/custom_components/ha_3d_dashboard/frontend
          cp -a custom_components/ha_3d_dashboard/frontend/. pr-head/custom_components/ha_3d_dashboard/frontend/

          if test -n "$(git -C pr-head status --porcelain --untracked-files=all -- custom_components/ha_3d_dashboard/frontend)"; then
            git -C pr-head config user.name "github-actions[bot]"
            git -C pr-head config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C pr-head add custom_components/ha_3d_dashboard/frontend
            git -C pr-head commit -m "build(ha3d): update generated HA frontend [skip ci]"
            git -C pr-head push origin "HEAD:${PR_HEAD_REF}"
          fi

      - name: Verify generated HA frontend parity
        env:
          SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if test "$SAME_REPO_PR" = "true"; then
            diff -qr custom_components/ha_3d_dashboard/frontend pr-head/custom_components/ha_3d_dashboard/frontend
            test -z "$(git -C pr-head status --porcelain --untracked-files=all -- custom_components/ha_3d_dashboard/frontend)"
          else
            git diff --exit-code -- custom_components/ha_3d_dashboard/frontend
            test -z "$(git status --porcelain --untracked-files=all -- custom_components/ha_3d_dashboard/frontend)"
          fi

      - name: Type check
        run: bun run check-types

      - name: Test
        # Pascal's package suites create temporary source probes and include tight
        # wall/history timing assertions. Running package suites concurrently can
        # make those tests contend for CPU and race each other's temporary files.
        # Keep each package's own test concurrency intact, but serialize packages.
        run: bunx turbo run test --concurrency=1

      - name: Build
        run: bun run build

  cli-smoke:
    # Release keeps the macOS smoke. PR CI uses Linux to avoid paying the
    # macOS runner premium on every development iteration.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke-test the packed CLI and editor runtime
        env:
          PASCAL_PORTABLE_BUILD: "1"
        run: |
          bun run build --filter editor
          cd packages/cli
          bun run build
          bun run stage-runtime
          bun run smoke-runtime
