name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Pinned to match `packageManager` in package.json. Unpinned, this floats
      # to whatever bun is latest, so a bun release can break the gate with no
      # change in the repo — and CI then disagrees with what contributors run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: Validate agent skills and plugin packages
        run: bun run skills:validate

      - name: Validate Home Assistant custom integration
        run: |
          python3 -m compileall -q custom_components/ha_3d_dashboard
          python3 -m json.tool custom_components/ha_3d_dashboard/manifest.json >/dev/null
          python3 -m unittest discover -s custom_components/ha_3d_dashboard/tests -p 'test_*.py'
          bun run --cwd apps/editor build:ha-panel
          git diff --exit-code -- custom_components/ha_3d_dashboard/frontend
          test -z "$(git status --porcelain --untracked-files=all -- custom_components/ha_3d_dashboard/frontend)"

      - name: Upload generated HA panel bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ha3d-panel-bundle
          path: custom_components/ha_3d_dashboard/frontend/
          if-no-files-found: warn
          retention-days: 3

      - name: Type check
        run: bun run check-types

      - name: Test
        # Pascal's package suites create temporary source probes and include tight
        # wall/history timing assertions. Running package suites concurrently can
        # make those tests contend for CPU and race each other's temporary files.
        # Keep each package's own test concurrency intact, but serialize packages.
        run: bunx turbo run test --concurrency=1

      - name: Build
        run: bun run build

  cli-smoke:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke-test the packed CLI and editor runtime
        env:
          PASCAL_PORTABLE_BUILD: "1"
        run: |
          bun run build --filter editor
          cd packages/cli
          bun run build
          bun run stage-runtime
          bun run smoke-runtime
