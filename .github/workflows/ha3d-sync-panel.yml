name: HA3D Sync Panel Bundle

on:
  push:
    branches:
      - feat/ha3d-native-project-shell

permissions:
  contents: write

concurrency:
  group: ha3d-sync-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ha3d-native-project-shell
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native HA panel
        run: bun run --cwd apps/editor build:ha-panel

      - name: Commit generated frontend
        run: |
          if git diff --quiet -- custom_components/ha_3d_dashboard/frontend; then
            if test -z "$(git status --porcelain --untracked-files=all -- custom_components/ha_3d_dashboard/frontend)"; then
              echo "Native panel bundle is already synchronized."
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A custom_components/ha_3d_dashboard/frontend
          git commit -m "build(ha3d): sync native panel bundle"
          git push origin HEAD:feat/ha3d-native-project-shell
